[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "r3chain-geothermal"
version = "0.1.0"
description = "R3-CHAIN orchestration package: typed PyDoublet coupling contract, adapter and reporting code (deliberately independent of the PyDoublet and pandapipesAI repositories — see ADR-001 D7). Depends directly on the standalone pandapipes PyPI library (BSD-3-Clause, unrelated to the repo-hosting/licence questions in Q10) for the synthetic network layer, T2.2."
requires-python = ">=3.11"
# No license field: intentionally omitted. This package's own code is not
# the issue, but it sits in the same repository as PyDoublet reference
# material whose licence is unresolved (Phase-0 Q10, Apache-2.0 vs MIT
# declarations conflict) -- adding any licence claim here would be premature
# until that is resolved. See docs/decisions/phase0-questions.md Q10.
authors = [
    { name = "Ishantha Hewaratne" },
]
dependencies = [
    # Pydantic v2 API (model_dump, ConfigDict, discriminated unions) --
    # same range already tested and shipped for PyDoublet itself (T1.4A).
    "pydantic>=2.0,<3",
    # RFC 6901 JSON Pointer resolution for raw PyDoublet result field paths
    # (ADR-002) -- a mature library rather than a hand-rolled path parser.
    "jsonpointer>=3.0,<4",
    # Synthetic district-heating network construction and thermo-hydraulic
    # pipeflow (T2.2) -- bounded to the tested-compatible 0.14.x series
    # (0.14.0 verified installed in .venvs/pandapipesai; this project's own
    # test suite, including the pressure-semantics pinning test, is the
    # actual compatibility check for any 0.14.x patch release). BSD-3-Clause;
    # a standalone PyPI library, not the pandapipesAI repository itself --
    # unrelated to Q10.
    "pandapipes>=0.14,<0.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# T5.1A: the interim standalone MCP server (mcp_server/) is an OPTIONAL
# layer -- normal simulation-package installation (adapter/network/
# economics/workflow/CLI) never requires `mcp`. Pinned <2: MCP Python SDK
# 2.0.0 renamed FastMCP -> MCPServer and is a breaking rewrite; mcp_server/
# uses the v1 `mcp.server.fastmcp.FastMCP` API, matching pandapipesAI's own
# verified-working pin (docs/spikes/mcp-entrypoint-spike.md §6).
mcp = [
    "mcp>=1.28,<2",
]

[project.scripts]
r3chain-geothermal-demo = "r3chain_geothermal.workflow.cli:main"
r3chain-geothermal-mcp-server = "r3chain_geothermal.mcp_server.server:main"
r3chain-geothermal-mcp-demo = "r3chain_geothermal.mcp_client.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["r3chain_geothermal*"]

[tool.setuptools.package-data]
# The MCP server's packaged default config (mcp_server/config.py) -- a
# byte-identical copy of config/demo_assumptions.json, kept in sync by
# tests/mcp_server/test_server_contract.py. Without this, a wheel install
# has no config/ directory at all (it lives at the repo root, outside
# src/) and geo_get_capabilities/geo_run_workflow fail at server startup.
"r3chain_geothermal.mcp_server" = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
